[licenses]
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # public-domain equivalent (whisper-rs)
    "Unlicense",
    # the exception only widens Apache-2.0, so this is strictly more
    # permissive; target-lexicon pulls it in at build time under the gtk4
    # -sys crates via system-deps
    "Apache-2.0 WITH LLVM-exception",
]

[advisories]
yanked = "deny"
ignore = [
    # quick-xml DoS advisories (fixed in 0.41). Only used by wayland-scanner
    # at build time to parse the protocol XML shipped inside the crate, never
    # attacker-controlled input. Drop when wayland-scanner moves past ^0.39.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]
