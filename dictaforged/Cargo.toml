[package]
name = "dictaforged"
description = "Dictation daemon: hotkeys, audio, transcription, text injection"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.103"
input-linux = "0.7.1"
serde_json = "1.0.150"
wayland-client = "0.31.14"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
x11rb = { version = "0.14.0", features = ["xtest", "allow-unsafe-code"] }
xkbcommon = { version = "0.9.0", features = ["x11"] }
