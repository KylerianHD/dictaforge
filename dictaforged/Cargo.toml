[package]
name = "dictaforged"
description = "Dictation daemon: hotkeys, audio, transcription, text injection"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.103"
audioadapter-buffers = "4.0.0"
cpal = "0.18.1"
input-linux = "0.7.1"
rubato = "4.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.3"
wayland-client = "0.31.14"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
whisper-rs = "0.16.0"
x11rb = { version = "0.14.0", features = ["xtest", "allow-unsafe-code"] }
xkbcommon = { version = "0.9.0", features = ["x11"] }
zbus = "5.18.0"
